<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier des Rendez-vous</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fr.js"></script>
    <style>
     
        #calendar {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .fc-event-title {
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>
    <div id="calendar"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const calendarEl = document.getElementById('calendar');

        
            async function fetchRendezVous() {
                try {
                    const response = await fetch('http://localhost:5000/rendezvous/all');
                    return await response.json();
                } catch (error) {
                    console.error("Erreur lors du chargement des rendez-vous :", error);
                    return [];
                }
            }

            // Transformer les données pour FullCalendar
            const events = (await fetchRendezVous()).map(rdv => ({
                title: `👤 ${rdv.client} - 🏥 ${rdv.professionnel}`,
                start: rdv.date,
                backgroundColor: "#007bff",
                borderColor: "#0056b3",
                textColor: "white"
            }));

            const calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'fr',
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: events,
                eventDidMount: function(info) {
                
                    info.el.setAttribute("title", `Rendez-vous avec ${info.event.title}`);
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>
