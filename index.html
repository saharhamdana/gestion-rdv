<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier des Rendez-vous</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fr.js"></script>
</head>
<body>
    <div id="calendar"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const calendarEl = document.getElementById('calendar');

            // Récupérer les rendez-vous depuis l'API
            async function fetchRendezVous() {
                const response = await fetch('http://localhost:5000/rendezvous/all');
                return await response.json();
            }

            // Transformer les données pour FullCalendar
            const events = (await fetchRendezVous()).map(rdv => ({
                title: `${rdv.client} - ${rdv.professionnel}`,
                start: rdv.date
            }));

            const calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'fr',
                initialView: 'dayGridMonth',
                events: events
            });

            calendar.render();
        });
    </script>
</body>
</html>
